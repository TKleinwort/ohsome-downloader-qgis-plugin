name: Ruff

on:
  pull_request:
  push:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: OhsomeDownloader
          version: "0.14.7"
          args: format --check
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: OhsomeDownloader
          version: "0.14.7"
          args: check