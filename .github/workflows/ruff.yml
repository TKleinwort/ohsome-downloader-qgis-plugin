name: Ruff

on:
  pull_request:
  push:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: OhsomeDownloader
          version: "0.14.7"
          args: format --check
      - uses: astral-sh/ruff-action@v3
        with:
          src: OhsomeDownloader
          version: "0.14.7"
          args: check